# Standalone local runtime for this profile. This is the same digest-addressed
# image exported into Spawnpoint releases; scripts/validate-profiles.sh keeps
# Compose and profile.json in agreement.
services:
  factorio:
    image: docker.io/factoriotools/factorio:2.0.77@sha256:c6092b912bd142994170a8c430472be4259b57fca4eb3ebaa421fe46885fd5a4
    ports:
      - "34197:34197/udp"
      # RCON stays on localhost: an operator surface, never a player one. The
      # server generates its own password into data/config/rconpw.
      - "127.0.0.1:27015:27015"
    volumes:
      - "./data:/factorio"
    environment:
      # First boot generates a map; later boots load the newest save.
      LOAD_LATEST_SAVE: "true"
      GENERATE_NEW_SAVE: "true"
      SAVE_NAME: "spawnpoint"
    restart: "no"
    stop_grace_period: 60s
